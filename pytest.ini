[pytest]
testpaths = tests
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    # aiqclib 0.14 warns when its own (deprecated) NRT QC copy is used. Here
    # that means an import still points at aiqclib instead of nrtqclib.
    error:.*is moving to the nrtqclib package:DeprecationWarning
