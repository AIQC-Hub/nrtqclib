name: Code Coverage
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run code coverage
        run: uv run pytest --cov --cov-branch --cov-report=xml
      # The token is the AIQC-Hub organisation secret, shared with the other
      # repositories that report to Codecov. A failed upload fails the run, so
      # it does not pass unnoticed.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AIQC-Hub/nrtqclib
          fail_ci_if_error: true
